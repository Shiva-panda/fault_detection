model_selection:
  model:

    XGBClassifier:
      search_param_grid:
        n_estimators: [50, 100]
        max_depth: [3, 5]
        learning_rate: [0.05, 0.1]

    GradientBoostingClassifier:
      search_param_grid:
        n_estimators: [50, 100]
        learning_rate: [0.05, 0.1]

    SVC:
      search_param_grid:
        C: [0.1, 1, 10]
        kernel: ["linear", "rbf"]

    RandomForestClassifier:
      search_param_grid:
        n_estimators: [50, 100]
        max_depth: [5, 10]