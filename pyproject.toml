[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faultdetection"
version = "0.0.1"
description = "Fault detection and monitoring system"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Shiva" }]
license = { text = "MIT" }

dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
